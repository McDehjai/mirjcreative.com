<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRJ Creative | Audit Pipeline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #F5F2EE; min-height: 100vh; }

  /* PASSWORD GATE */
  #gate {
    position: fixed; inset: 0; background: #5B3FA6;
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate-box {
    background: #fff; border-radius: 16px; padding: 2.5rem 2rem;
    width: 100%; max-width: 360px; text-align: center;
  }
  #gate-box .logo { font-size: 22px; font-weight: 700; color: #5B3FA6; letter-spacing: 0.05em; margin-bottom: 4px; }
  #gate-box .sub { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
  #gate-box input {
    width: 100%; padding: 10px 14px; border: 1.5px solid #ccc;
    border-radius: 8px; font-size: 15px; margin-bottom: 12px; outline: none;
  }
  #gate-box input:focus { border-color: #5B3FA6; }
  #gate-box button {
    width: 100%; padding: 11px; background: #E8614A; color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  #gate-box button:hover { opacity: 0.88; }
  #gate-error { color: #E8614A; font-size: 13px; margin-top: 8px; display: none; }

  /* APP */
  #app { display: none; max-width: 780px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  .header-bar {
    background: #5B3FA6; border-radius: 14px; padding: 1.25rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;
  }
  .header-bar .brand { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
  .header-bar .sub { color: #C4B8F0; font-size: 12px; margin-top: 2px; }
  .stage-badge { background: #E8614A; color: #fff; font-size: 12px; font-weight: 600; padding: 5px 13px; border-radius: 8px; }

  .stage-nav { display: flex; gap: 6px; margin-bottom: 1.5rem; }
  .stage-dot { flex: 1; height: 4px; border-radius: 2px; background: #ddd; transition: background 0.2s; }
  .stage-dot.active { background: #E8614A; }
  .stage-dot.done { background: #5B3FA6; }

  .stage-card { background: #fff; border: 1px solid #e8e4f0; border-radius: 14px; padding: 1.5rem; margin-bottom: 1rem; }
  .stage-label { font-size: 10px; font-weight: 700; color: #E8614A; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .stage-title { font-size: 18px; font-weight: 700; color: #1A1A1A; margin-bottom: 10px; }
  .stage-desc { font-size: 13px; color: #555; line-height: 1.65; margin-bottom: 1rem; }

  .role-tags { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .role-tag { font-size: 11px; padding: 3px 10px; border-radius: 6px; font-weight: 600; }
  .role-tag.human { background: #EEF0FF; color: #5B3FA6; }
  .role-tag.ai { background: #FEF0ED; color: #E8614A; }

  .hint-box { background: #EEF0FF; border-left: 3px solid #5B3FA6; border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 12px; color: #5B3FA6; line-height: 1.6; margin-bottom: 1rem; }

  label.field-label { font-size: 12px; font-weight: 600; color: #666; display: block; margin-bottom: 6px; }
  textarea {
    width: 100%; border: 1.5px solid #ddd; border-radius: 8px;
    padding: 10px 12px; font-size: 13px; font-family: inherit;
    color: #1A1A1A; background: #FAFAFA; resize: vertical; min-height: 120px; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: #5B3FA6; }
  textarea::placeholder { color: #bbb; }

  .run-btn {
    width: 100%; padding: 12px; background: #5B3FA6; color: #fff;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 1rem; transition: opacity 0.15s; font-family: inherit;
  }
  .run-btn:hover { opacity: 0.88; }
  .run-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .output-wrap { margin-top: 1rem; }
  .output-label { font-size: 11px; font-weight: 700; color: #2E7D32; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .output-box {
    background: #F1F8F1; border: 1px solid #C8E6C9; border-left: 4px solid #2E7D32;
    border-radius: 0 8px 8px 0; padding: 1rem 1.25rem;
    font-size: 13px; color: #1A1A1A; line-height: 1.75;
    white-space: pre-wrap; min-height: 80px;
  }
  .output-box.loading { color: #999; font-style: italic; }

  .copy-btn {
    margin-top: 8px; padding: 7px 16px; background: transparent;
    border: 1px solid #5B3FA6; color: #5B3FA6; border-radius: 6px;
    font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .copy-btn:hover { background: #5B3FA6; color: #fff; }

  .next-btn {
    width: 100%; padding: 12px; background: transparent; color: #5B3FA6;
    border: 2px solid #5B3FA6; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 10px; font-family: inherit; transition: all 0.15s;
  }
  .next-btn:hover { background: #5B3FA6; color: #fff; }

  .complete-card { background: #fff; border: 1px solid #e8e4f0; border-radius: 14px; padding: 2rem; text-align: center; }
  .complete-card h3 { font-size: 20px; font-weight: 700; color: #5B3FA6; margin-bottom: 8px; }
  .complete-card p { font-size: 14px; color: #555; line-height: 1.7; }

  .reset-link { display: block; text-align: center; font-size: 12px; color: #aaa; cursor: pointer; margin-top: 1.5rem; text-decoration: underline; }

  .save-bar { background: #FDF6EC; border: 1px solid #F5C4A0; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #8B5E3C; margin-bottom: 1rem; }
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate">
  <div id="gate-box">
    <div class="logo">MIRJ CREATIVE</div>
    <div class="sub">Audit Pipeline &mdash; Private Access</div>
    <input type="password" id="pw-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')checkPW()" />
    <button onclick="checkPW()">Enter</button>
    <div id="gate-error">Incorrect password. Try again.</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="header-bar">
    <div>
      <div class="brand">MIRJ CREATIVE</div>
      <div class="sub">AI Workflow Audit Pipeline</div>
    </div>
    <div class="stage-badge" id="stage-badge">Stage 1 of 5</div>
  </div>

  <div class="save-bar">&#128274; Private tool &mdash; for MIRJ Creative internal use only. Not indexed or publicly linked.</div>

  <div class="stage-nav" id="stage-nav"></div>
  <div id="stage-container"></div>
  <span class="reset-link" id="reset-link" onclick="resetPipeline()" style="display:none">&#8635; Start over with a new client</span>
</div>

<script>
const HASH = "db3a74c5f94c3e8a2b1f6d9e0c7b4a2f1e8d5c3b0a9f6e4d2c1b8a7f5e3d1c0";

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPW() {
  const val = document.getElementById('pw-input').value;
  const hash = await sha256(val);
  if (hash === HASH) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderStage();
  } else {
    document.getElementById('gate-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

const STAGES = [
  {
    num: 1, label: "Stage 01", title: "Client Intake Summary",
    desc: "Paste the client's completed intake responses below. Claude will summarize them into a structured brief, identify the top 3 workflow pain points, and flag any missing or vague information.",
    hint: "Review the flagged gaps before moving to Stage 2. Follow up with the client on anything unclear.",
    placeholder: "Paste the client's intake form responses here...\n\nExample: 2-person event marketing agency, year 3. Tools: Asana, Canva, Google Drive. Pain points: approval chasing, manual asset reformatting. AI experience: tried ChatGPT once, did not stick.",
    prompt: (input) => `You are an AI workflow consultant at MIRJ Creative. A client has submitted an intake form for an AI Workflow Audit.

Summarize their responses into a structured brief with these three sections:

1. CLIENT OVERVIEW
2 to 3 sentences about who they are and what they do.

2. TOP 3 WORKFLOW PAIN POINTS
Name each pain point and explain the root cause behind it, not just the symptom.

3. FLAGGED GAPS
List every question left vague or unanswered. For each, explain why it matters to the audit.

Keep the language clear, direct, and specific. No filler.

Client intake responses:
${input}`
  },
  {
    num: 2, label: "Stage 02", title: "Research and Context Brief",
    desc: "Paste the Stage 1 output below. Claude will research the client's industry norms, tool stack integration gaps, and how similar teams are using AI today.",
    hint: "The Key Audit Anchors at the end of this output should drive your Stage 3 prompt. Read them carefully before continuing.",
    placeholder: "Paste the Stage 1 structured brief here...",
    prompt: (input) => `You are an AI workflow consultant at MIRJ Creative preparing a research context brief.

Using the intake summary below, produce a context brief with these sections:

1. COMMON PAIN POINTS FOR TEAMS LIKE THIS
What problems come up again and again for teams of this type, size, and industry? Name the patterns and explain why they happen.

2. TOOL STACK GAPS
What are the known limitations and integration gaps in the tools they listed? What does not talk to what, and what does that cost them in daily time and effort?

3. HOW TEAMS LIKE THIS ARE USING AI TODAY
What AI tools and workflows are working for similar teams right now? What fails to stick and why?

KEY AUDIT ANCHORS
List 3 specific insights from your research that should drive the recommendations in this audit.

Be specific. No generic statements.

Intake summary:
${input}`
  },
  {
    num: 3, label: "Stage 03", title: "Audit Draft Generation",
    desc: "Paste the Stage 1 and Stage 2 outputs together below. Claude will write the first full draft of the audit across all five sections.",
    hint: "Every [NEEDS INFO] and [STRATEGIC CALL] flag in the output is your edit target. Write them down before moving to Stage 4.",
    placeholder: "Paste Stage 1 and Stage 2 outputs here together. Label them clearly:\n\nSTAGE 1 SUMMARY:\n[paste here]\n\nSTAGE 2 CONTEXT BRIEF:\n[paste here]",
    prompt: (input) => `You are writing a first-pass AI Workflow Audit for MIRJ Creative.

Write a specific, direct audit document with five sections:

1. EXECUTIVE SUMMARY
3 to 4 sentences. Name the core problem, the good news, and what this audit delivers. No fluff.

2. CURRENT WORKFLOW ASSESSMENT
Describe how work moves through this team based on what they shared. Name where it is person-dependent, informal, or fragile. Flag anything unclear with [NEEDS INFO].

3. TOOL STACK ANALYSIS
Assess each tool individually. Name what it is being used for, what it is not, and what that gap costs the team.

4. IDENTIFIED GAPS AND FRICTION POINTS
Name each gap. State the root cause, not just the symptom.

5. PRELIMINARY RECOMMENDATIONS
5 recommendations in priority order. Each must be specific enough to act on Monday morning. Flag strategic decisions with [STRATEGIC CALL].

Do not use filler. Flag unclear sections with [NEEDS INFO].

Client context:
${input}`
  },
  {
    num: 4, label: "Stage 04", title: "Review and Refinement",
    desc: "Paste the Stage 3 draft below. Claude will check for consistency issues, remove hedging language, and sharpen any vague recommendations.",
    hint: "Accept or reject each suggested rewrite based on your strategic judgment. You make the calls — Claude sharpens the language.",
    placeholder: "Paste the full Stage 3 audit draft here...",
    prompt: (input) => `You are reviewing a draft AI Workflow Audit for MIRJ Creative.

Do these four things:

1. CONSISTENCY CHECK
Find any sections that contradict each other. Quote and explain.

2. TONE CHECK
Find hedging language (likely, probably, might, almost certainly) and rewrite each instance to be direct and confident.
Show: ORIGINAL: [quote] / REWRITE: [new version]

3. CLARITY CHECK
Find any recommendation too vague to act on. Rewrite it so the client knows what to do, who does it, and how long it takes.
Show: ORIGINAL: [quote] / REWRITE: [new version]

4. WHAT IS STRONG
List 3 to 5 things working well that should not change.

Do not change strategic direction without asking. Flag with [STRATEGIC CALL].

Draft:
${input}`
  },
  {
    num: 5, label: "Stage 05", title: "Delivery Package Assembly",
    desc: "Paste the final refined audit below. Claude will write a one-page executive summary and a prioritized next steps plan ready for client delivery.",
    hint: "After delivery, use the next steps plan as your bridge into the AI Workflow Retainer conversation.",
    placeholder: "Paste the final refined audit here...",
    prompt: (input) => `You are assembling the final delivery package for a MIRJ Creative AI Workflow Audit.

Produce two components:

COMPONENT 1 — ONE-PAGE EXECUTIVE SUMMARY
Write for a non-technical stakeholder who has not read the full audit.
4 to 5 short paragraphs covering: what we found, why it matters, and what happens next.
Warm, confident, and specific. No jargon.

COMPONENT 2 — NEXT STEPS PLAN
List 5 prioritized action items. For each one:
- The action in one clear sentence
- What the client gains when they do it
- Timeline (this week / week 1 / week 2 to 3 / month 1)
- Cost (zero / low / requires budget discussion)

End with one sentence the consultant can use to open the delivery call.

Final audit:
${input}`
  }
];

let currentStage = 0;

function renderNav() {
  const nav = document.getElementById('stage-nav');
  nav.innerHTML = '';
  STAGES.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'stage-dot' + (i < currentStage ? ' done' : i === currentStage ? ' active' : '');
    nav.appendChild(dot);
  });
  document.getElementById('stage-badge').textContent = currentStage >= STAGES.length ? 'Complete' : `Stage ${currentStage + 1} of 5`;
}

function renderStage() {
  if (currentStage >= STAGES.length) { renderComplete(); return; }
  const s = STAGES[currentStage];
  document.getElementById('stage-container').innerHTML = `
    <div class="stage-card">
      <div class="stage-label">${s.label}</div>
      <div class="stage-title">${s.title}</div>
      <div class="role-tags">
        <span class="role-tag human">&#128100; You: paste input</span>
        <span class="role-tag ai">&#10024; Claude: generates output</span>
      </div>
      <div class="stage-desc">${s.desc}</div>
      <div class="hint-box">&#128161; ${s.hint}</div>
      <label class="field-label" for="stage-input">Your input</label>
      <textarea id="stage-input" placeholder="${s.placeholder}" rows="7"></textarea>
      <button class="run-btn" id="run-btn" onclick="runStage()">&#9654; Run Stage ${s.num}</button>
      <div id="output-area" style="display:none">
        <div class="output-wrap">
          <div class="output-label">&#10003; Claude Output</div>
          <div class="output-box" id="output-text"></div>
          <button class="copy-btn" onclick="copyOutput()">Copy output</button>
        </div>
        <button class="next-btn" onclick="nextStage()">
          ${currentStage < 4 ? `Continue to Stage ${s.num + 1} &#8594;` : 'Assemble Delivery Package &#8594;'}
        </button>
      </div>
    </div>`;
  document.getElementById('reset-link').style.display = currentStage > 0 ? 'block' : 'none';
  renderNav();
}

async function runStage() {
  const input = document.getElementById('stage-input').value.trim();
  if (!input) { alert('Please paste your input before running this stage.'); return; }
  const btn = document.getElementById('run-btn');
  btn.disabled = true; btn.textContent = 'Running...';
  const outputArea = document.getElementById('output-area');
  const outputText = document.getElementById('output-text');
  outputArea.style.display = 'block';
  outputText.className = 'output-box loading';
  outputText.textContent = 'Claude is thinking...';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: STAGES[currentStage].prompt(input) }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(b => b.type === 'text')?.text || 'No output returned.';
    outputText.className = 'output-box';
    outputText.textContent = text;
  } catch(e) {
    outputText.className = 'output-box';
    outputText.textContent = 'Something went wrong. Please check your connection and try again.';
  }
  const s = STAGES[currentStage];
  btn.disabled = false;
  btn.textContent = `&#9654; Re-run Stage ${s.num}`;
}

function copyOutput() {
  const text = document.getElementById('output-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy output', 1500);
  });
}

function nextStage() { currentStage++; renderStage(); renderNav(); window.scrollTo({top:0,behavior:'smooth'}); }

function renderComplete() {
  document.getElementById('stage-container').innerHTML = `
    <div class="complete-card">
      <div style="font-size:44px;margin-bottom:12px">&#10003;</div>
      <h3>Audit pipeline complete</h3>
      <p style="margin-top:8px">All five stages are done. Your delivery package is ready.<br><br>
      Use the Stage 5 output as your base document. Add the client name, your MIRJ Creative header, and schedule the delivery call.<br><br>
      <strong>Next step:</strong> Use the next steps plan to open the AI Workflow Retainer conversation.</p>
    </div>`;
  document.getElementById('reset-link').style.display = 'block';
  renderNav();
}

function resetPipeline() { currentStage = 0; renderStage(); }
</script>
</body>
</html>
