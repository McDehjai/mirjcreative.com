<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Call | MIRJ Creative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F7FB;
    --indigo: #3F55BF;
    --indigo-deep: #2E3F94;
    --coral: #FF8A70;
    --coral-deep: #E86B4F;
    --mint: #7FE0C4;
    --purple: #695CCB;
    --pink-soft: #EEEEFA;
    --ink: #221F33;
    --ink-soft: #676280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--coral-deep);
    font-weight: 600;
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(34px, 5vw, 52px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    max-width: 14ch;
  }

  h1 em {
    font-style: italic;
    color: var(--coral);
  }

  .lede {
    margin-top: 20px;
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 52ch;
  }

  .tagline {
    margin-top: 28px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--coral-deep);
    letter-spacing: 0.01em;
  }

  .services {
    margin-top: 48px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .service-pill {
    border: 1px solid rgba(105, 92, 203, 0.25);
    background: var(--pink-soft);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 100px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .service-pill:hover {
    border-color: var(--indigo);
  }

  .service-pill.active {
    background: var(--indigo);
    border-color: var(--indigo);
    color: #ffffff;
  }

  .embed-frame {
    margin-top: 44px;
    background: #ffffff;
    border: 1px solid rgba(105, 92, 203, 0.2);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px -32px rgba(63, 85, 191, 0.35);
  }

  .embed-frame-header {
    padding: 22px 28px;
    border-bottom: 1px solid var(--pink-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .embed-frame-header span {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .dot-row { display: flex; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot:nth-child(1) { background: var(--indigo); }
  .dot:nth-child(2) { background: var(--coral); }
  .dot:nth-child(3) { background: var(--mint); }

  #cal-booking {
    width: 100%;
    height: 700px;
  }

  footer {
    margin-top: 40px;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
  }

  footer a {
    color: var(--coral-deep);
    text-decoration: none;
    font-weight: 500;
  }

  @media (max-width: 600px) {
    #cal-booking { height: 640px; }
    .wrap { padding: 44px 18px 64px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">MIRJ Creative</div>
    <h1>Let's find a time that <em>works</em>.</h1>
    <p class="lede">Pick a slot below and it'll land straight on my calendar. No back and forth, no email chain, just a confirmed time.</p>
    <p class="tagline">Clarity. Alignment. Opportunity.</p>

    <div class="services">
      <button class="service-pill active" data-slug="mirjcreative/30min">Free Consult</button>
      <button class="service-pill" data-slug="mirjcreative/audit-chat">Audit Chat</button>
      <button class="service-pill" data-slug="mirjcreative/alignment-chat">Alignment</button>
    </div>

    <div class="embed-frame">
      <div class="embed-frame-header">
        <div class="dot-row">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <span>Select a service, then a time</span>
      </div>
      <div id="cal-booking"></div>
    </div>

    <footer>
      Prefer email? Reach out directly at <a href="mailto:hello@mirjcreative.com">hello@mirjcreative.com</a>
    </footer>
  </div>

  <!-- Cal.com embed -->
  <script type="text/javascript">
    (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");

    Cal("init", { origin: "https://cal.com" });

    function loadEvent(slug) {
      document.getElementById("cal-booking").innerHTML = "";
      Cal("inline", {
        elementOrSelector: "#cal-booking",
        calLink: slug,
        layout: "month_view",
        config: {
          theme: "light"
        }
      });
    }

    const typeMap = {
      consult: "mirjcreative/30min",
      audit: "mirjcreative/audit-chat",
      alignment: "mirjcreative/alignment-chat"
    };
    const requestedType = new URLSearchParams(window.location.search).get("type");
    const initialSlug = typeMap[requestedType] || "mirjcreative/30min";
    loadEvent(initialSlug);

    document.querySelectorAll(".service-pill").forEach(function (btn) {
      if (btn.getAttribute("data-slug") === initialSlug) {
        document.querySelectorAll(".service-pill").forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
      }
    });

    document.querySelectorAll(".service-pill").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".service-pill").forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        loadEvent(btn.getAttribute("data-slug"));
      });
    });

    Cal("ui", {
      styles: { branding: { brandColor: "#3F55BF" } },
      hideEventTypeDetails: false
    });
  </script>
</body>
</html>
